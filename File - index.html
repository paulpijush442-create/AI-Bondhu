<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bondhu - Smart Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        header { background: linear-gradient(135deg, #2563eb, #7c3aed); padding: 15px 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.5px; }
        header p { font-size: 0.8rem; color: #e2e8f0; margin-top: 2px; }

        /* Chat Area */
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 82%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.2s ease-in; }
        .user-msg { background-color: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai-msg { background-color: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        
        /* Copy Button */
        .copy-btn { display: inline-block; margin-top: 8px; padding: 4px 10px; font-size: 0.75rem; background: #334155; color: #cbd5e1; border: none; border-radius: 6px; cursor: pointer; }
        .copy-btn:active { background: #475569; }

        /* Input Area */
        #input-area { display: flex; padding: 12px; background-color: #1e293b; border-top: 1px solid #334155; gap: 8px; }
        #user-input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid #475569; background-color: #0f172a; color: white; font-size: 1rem; outline: none; }
        #user-input:focus { border-color: #3b82f6; }
        #send-btn { background: linear-gradient(135deg, #2563eb, #7c3aed); color: white; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        #send-btn:disabled { opacity: 0.5; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <h1>🤖 AI Smart Assistant</h1>
        <p>যেকোনো প্রশ্ন করুন • ফাস্ট ও সঠিক উত্তর</p>
    </header>

    <div id="chat-box">
        <div class="message ai-msg">
            নমস্কার! আমি আপনার ব্যক্তিগত AI সহকারী। বাংলা বা ইংরেজিতে যেকোনো প্রশ্ন করুন, আমি দ্রুত ও সঠিক উত্তর দেওয়ার চেষ্টা করব।
        </div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="আপনার প্রশ্ন লিখুন..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">পাঠান</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Enter key support
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Add User Message
            appendMessage(text, 'user-msg');
            userInput.value = '';
            sendBtn.disabled = true;

            // Add Loading Indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-msg';
            loadingDiv.innerText = 'উত্তর তৈরি হচ্ছে... ⏳';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Fast & Free Public AI API (No API Key / No Sign-up needed)
                const systemPrompt = "You are a helpful, accurate, and fast AI assistant. Give clear, concise, and correct answers in the same language the user asks (Bengali or English).";
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: text }
                        ],
                        model: 'openai'
                    })
                });

                const reply = await response.text();
                chatBox.removeChild(loadingDiv);
                appendMessage(reply, 'ai-msg', true);

            } catch (error) {
                chatBox.removeChild(loadingDiv);
                appendMessage('দুঃখিত, ইন্টারনেট সংযোগে সমস্যা হচ্ছে। অনুগ্রহ করে আবার চেষ্টা করুন।', 'ai-msg');
            }

            sendBtn.disabled = false;
            userInput.focus();
        }

        function appendMessage(text, className, addCopy = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + className;
            
            const textSpan = document.createElement('div');
            textSpan.innerText = text;
            msgDiv.appendChild(textSpan);

            if (addCopy) {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = '📋 কপি করুন';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(text);
                    copyBtn.innerText = '✅ কপি হয়েছে';
                    setTimeout(() => copyBtn.innerText = '📋 কপি করুন', 2000);
                };
                msgDiv.appendChild(copyBtn);
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
