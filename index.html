<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bondhu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #ffffff; color: #1e293b; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header - Yellow & White Theme */
        header { background: linear-gradient(135deg, #facc15, #eab308); color: #1e293b; padding: 15px 20px; text-align: center; box-shadow: 0 3px 10px rgba(234, 179, 8, 0.25); }
        header h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: 0.5px; }
        header p { font-size: 0.82rem; color: #422006; font-weight: 600; margin-top: 2px; }

        /* Chat Area */
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background-color: #fefce8; }
        .message { max-width: 84%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* User Message - Bright Yellow */
        .user-msg { background-color: #facc15; color: #1e293b; font-weight: 500; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid #eab308; }
        
        /* AI Message - Clean White */
        .ai-msg { background-color: #ffffff; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #fde047; }
        
        /* Copy Button */
        .copy-btn { display: inline-block; margin-top: 8px; padding: 5px 12px; font-size: 0.75rem; font-weight: 600; background: #fef08a; color: #713f12; border: 1px solid #facc15; border-radius: 6px; cursor: pointer; }
        .copy-btn:active { background: #fde047; }

        /* Input Area */
        #input-area { display: flex; padding: 12px; background-color: #ffffff; border-top: 1px solid #fde047; gap: 8px; }
        #user-input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 2px solid #facc15; background-color: #ffffff; color: #1e293b; font-size: 1rem; outline: none; }
        #user-input:focus { border-color: #ca8a04; }
        #send-btn { background: linear-gradient(135deg, #facc15, #eab308); color: #1e293b; border: none; padding: 0 22px; border-radius: 25px; font-weight: 800; font-size: 1rem; cursor: pointer; box-shadow: 0 2px 6px rgba(234, 179, 8, 0.3); }
        #send-btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>

    <header>
        <h1>🤖 AI Bondhu</h1>
        <p>যেকোনো ভাষায় প্রশ্ন করুন • ফাস্ট ও সঠিক উত্তর</p>
    </header>

    <div id="chat-box">
        <div class="message ai-msg">নমস্কার! আমি AI Bondhu। বাংলা, ইংরেজি, হিন্দি বা যেকোনো ভাষায় প্রশ্ন করুন, আমি সাথে সাথে সেই ভাষাতেই সঠিক উত্তর দিয়ে দেব।</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="এখানে প্রশ্ন লিখুন..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">পাঠান</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        async function fetchAIResponse(prompt) {
            const systemRule = "You are AI Bondhu, a fast and accurate multilingual assistant. Detect the exact language the user is asking in (Bengali, Hindi, English, Banglish, or any other language) and reply clearly and accurately in that exact same language.";
            
            // Server 1 (Primary Fast POST)
            try {
                const res1 = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: 'system', content: systemRule },
                            { role: 'user', content: prompt }
                        ],
                        model: 'openai',
                        seed: Math.floor(Math.random() * 10000)
                    })
                });
                if (res1.ok) {
                    const text1 = await res1.text();
                    if (text1 && text1.trim().length > 0) return text1;
                }
            } catch (e) {}

            // Server 2 (Automatic Backup GET)
            const encodedPrompt = encodeURIComponent(systemRule + "\nUser: " + prompt);
            const res2 = await fetch(`https://text.pollinations.ai/${encodedPrompt}?model=mistral`);
            if (!res2.ok) throw new Error("Network error");
            return await res2.text();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-msg');
            userInput.value = '';
            sendBtn.disabled = true;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-msg';
            loadingDiv.innerText = 'উত্তর খুঁজছি... ⏳';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const reply = await fetchAIResponse(text);
                chatBox.removeChild(loadingDiv);
                appendMessage(reply, 'ai-msg', true);
            } catch (error) {
                chatBox.removeChild(loadingDiv);
                appendMessage('সার্ভার এখন একটু ব্যস্ত আছে বা নেটওয়ার্ক দুর্বল। অনুগ্রহ করে আবার চেষ্টা করুন।', 'ai-msg');
            }

            sendBtn.disabled = false;
            userInput.focus();
        }

        function appendMessage(text, className, addCopy = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + className;
            
            const textSpan = document.createElement('div');
            textSpan.innerText = text;
            msgDiv.appendChild(textSpan);

            if (addCopy) {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = '📋 কপি করুন';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(text);
                    copyBtn.innerText = '✅ কপি হয়েছে';
                    setTimeout(() => copyBtn.innerText = '📋 কপি করুন', 2000);
                };
                msgDiv.appendChild(copyBtn);
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
